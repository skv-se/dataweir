[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataweir"
version = "0.1.0"
description = "A data-layer guardrail and activity monitor for AI agents: least-privilege data access, tamper-evident audit, and anomaly/exfiltration detection at the query boundary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sai Vadlamudi" }]
keywords = [
    "ai-agents",
    "agentic-ai",
    "data-security",
    "least-privilege",
    "database-activity-monitoring",
    "dlp",
    "guardrails",
    "audit",
    "owasp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=25.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
sqlalchemy = ["SQLAlchemy>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "SQLAlchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/skv-se/dataweir"
Repository = "https://github.com/skv-se/dataweir"
Issues = "https://github.com/skv-se/dataweir/issues"
Changelog = "https://github.com/skv-se/dataweir/blob/main/CHANGELOG.md"

[project.scripts]
dataweir = "dataweir.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataweir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
